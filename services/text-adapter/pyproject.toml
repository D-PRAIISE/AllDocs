[project]
name = "text-adapter"
version = "0.1.0"
description = "AllDocs Text adapter — Markdown, HTML, EPUB <-> UDM"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-or-later" }
readme = "README.md"
dependencies = [
    "markdown-it-py>=3.0",
    "beautifulsoup4>=4.12",
    "bleach>=6.0",
]

[project.scripts]
text-adapter = "text_adapter.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/text_adapter"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM"]
