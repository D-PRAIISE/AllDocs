# AllDocs — getalldocs.com, co-hosted with livebooost.com on this box.
# Translated from deploy/Caddyfile. Caddy is NOT used here: nginx already
# owns :80/:443 for livebooost.com, so AllDocs is a second server block.

# Real visitor IP: Cloudflare sends CF-Connecting-IP. Fall back to the
# socket peer when the request didn't come through the edge, so the
# rate limiter and audit log never see an empty string.
map $http_cf_connecting_ip $alldocs_client_ip {
    ""      $remote_addr;
    default $http_cf_connecting_ip;
}

# nginx has no built-in $connection_upgrade; define it or the config
# fails to load. Next in production doesn't need WebSockets, but keeping
# the hop honest costs nothing.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name getalldocs.com www.getalldocs.com;

    # ACME HTTP-01 must be reachable BEFORE the HTTPS redirect: a
    # server-level `return` runs in the rewrite phase and would swallow
    # the challenge, so certbot could never issue/renew.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name getalldocs.com www.getalldocs.com;

    # Cloudflare Origin Certificate (SSL/TLS mode: Full (strict)).
    ssl_certificate     /etc/ssl/alldocs/origin.pem;
    ssl_certificate_key /etc/ssl/alldocs/origin.key;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # App enforces ALLDOCS_MAX_UPLOAD_MB (200); keep nginx above it so the
    # app returns its own friendly error rather than nginx's bare 413.
    # NOTE: Cloudflare's free plan caps request bodies at 100 MB regardless.
    client_max_body_size 210m;

    gzip on;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    # Imported session files (UDM JSON + extracted image/font assets) are
    # written at RUNTIME. `next start` only serves public/ files that existed
    # at build time, so these MUST come off disk here or they 404 in prod.
    # This mirrors Caddy's `handle_path /uploads/*` (prefix stripped).
    location /uploads/ {
        alias /opt/alldocs/web/public/uploads/;
        try_files $uri =404;
        add_header Cache-Control "no-store" always;
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $alldocs_client_ip;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;

        # Import status is a LONG-POLL that holds the connection up to 25s;
        # OCR jobs run up to 10 min. Don't let nginx cut them short.
        proxy_connect_timeout 15s;
        proxy_send_timeout    130s;
        proxy_read_timeout    130s;
        proxy_buffering       off;
    }
}
