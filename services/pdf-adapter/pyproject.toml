[project]
name = "pdf-adapter"
version = "0.1.0"
description = "AllDocs PDF format adapter — PDF <-> UDM"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-or-later" }
readme = "README.md"
dependencies = [
    "pymupdf>=1.27.0",
    "pillow>=11.0.0",
]

[project.scripts]
pdf-adapter = "pdf_adapter.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5.0",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pdf_adapter"]

# Bundle the Apache-2.0 fallback fonts (Arimo / Tinos / Cousine) with the
# wheel so installs are self-contained. See src/pdf_adapter/fonts/NOTICE.txt.
[tool.hatch.build.targets.wheel.force-include]
"src/pdf_adapter/fonts" = "pdf_adapter/fonts"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
