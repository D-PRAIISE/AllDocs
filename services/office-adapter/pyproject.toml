[project]
name = "office-adapter"
version = "0.1.0"
description = "AllDocs Office adapter — DOCX (and eventually XLSX, PPTX) <-> UDM"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-or-later" }
readme = "README.md"
dependencies = [
    "python-docx>=1.1",
    # Layout-faithful PDF -> DOCX (tables, columns, images). Used when a
    # passthrough source PDF is reachable; the linear fixed_to_flow
    # heuristic is the fallback when it isn't.
    "pdf2docx>=0.5.6",
    # XLSX read/write.
    "openpyxl>=3.1",
]

[project.scripts]
office-adapter = "office_adapter.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/office_adapter"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM"]
